[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sharkyo"
version = "0.1.0"
description = "Your shark in the terminal"
dependencies = [
    "groq",
    "keyring",
    "yaspin",
    "rich",
    "questionary",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
sharkyo = "sharkyo.main:main"

[tool.setuptools.packages.find]
include = ["sharkyo*"]

[tool.setuptools.package-data]
sharkyo = ["skills/*.md", "skills/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
