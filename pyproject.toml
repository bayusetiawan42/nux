[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nux"
version = "0.1.0"
description = "Your terminal on steroids - fast system operations for macOS/Linux"
dependencies = [
    "groq",
    "keyring",
    "yaspin",
    "rich",
    "pygments",
    "questionary",
    "strip_ansi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
nux = "nux.main:main"

[tool.setuptools.packages.find]
include = ["nux*"]

[tool.setuptools.package-data]
nux = ["skills/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
