[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sharkyo"
version = "0.1.0"
description = "Your shark in the terminal"
dependencies = [
    "openai",
    "yaspin",
    "rich",
    "questionary",
]

[project.scripts]
sharkyo = "sharkyo.main:main"

[tool.setuptools.package-data]
# system_prompt.txt is embedded at build time via build_constants.py.
# The .txt source is kept for editing; _generated_constants.py is the runtime artifact.
sharkyo = ["skills/*.md"]
